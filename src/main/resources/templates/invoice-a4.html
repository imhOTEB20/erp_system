<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Factura A4</title>
    <style>
        @page {
            size: A4 landscape; /* Ancho estándar de hoja A4 */
            margin: 15mm;
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 10pt;
            color: #333;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .bold { font-weight: bold; }
        .divider { border-top: 1px dashed #000; margin: 5px 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 2px 0; }
    </style>
</head>
<body>
<div class="text-center">
    <h2 style="margin: 0;">REPUESTOS WARNES</h2>
    <p style="margin: 2px 0;">Sucursal El Carril, Salta</p>
    <p style="margin: 2px 0;">CUIT: 30-12345678-9</p>
</div>

<div class="divider"></div>
<p>
    <span class="bold">Factura:</span> <span th:text="${sale.invoiceNumber}"></span><br/>
    <span class="bold">Fecha:</span> <span th:text="${#temporals.format(sale.createdAt, 'dd/MM/yyyy HH:mm')}"></span><br/>
    <span class="bold">Cliente:</span> <span th:text="${sale.customer != null ? sale.customer.businessName : 'Consumidor Final'}"></span>
</p>
<div class="divider"></div>

<table>
    <thead>
    <tr>
        <th class="text-left" style="width: 50%;">Cant x Artículo</th>
        <th class="text-right" style="width: 50%;">Subtotal</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${sale.items}">
        <td>
            <span th:text="${item.quantity + ' x ' + item.productName}"></span>
        </td>
        <td class="text-right">
            $<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}"></span>
        </td>
    </tr>
    </tbody>
</table>

<div class="divider"></div>
<h3 class="text-right" style="margin: 5px 0;">
    TOTAL: $<span th:text="${#numbers.formatDecimal(sale.totalAmount, 1, 'COMMA', 2, 'POINT')}"></span>
</h3>
<div class="divider"></div>

<p class="text-center">¡Gracias por su compra!<br/>Conserve este ticket.</p>
</body>
</html>
