spring.application.name=erp
server.port=8080

# DATASOURCE (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp_warnes}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:ACL&cag2031}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIBERNATE & JPA
# Al utilizar Flyway, delegamos la creaci n de tablas. Hibernate solo valida que las entidades coincidan con el DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# SECURITY (JWT)
# Clave Base64 de 576 bits (72 bytes), v lida para HS256, HS384 y HS512
application.security.jwt.secret-key=${JWT_SECRET:VGhpczEyOENoYXJhY3RlckJhc2U2NFNlY3JldEtleUZvclNwcmluZ0Jvb3RFUlBQcm9qZWN0MjAyNldhcm5lc0F1dG9wYXJ0ZXNTZWN1cmU=}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# LOGGING ( til para debugear las consultas que arma Hibernate y los filtros de seguridad)
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE